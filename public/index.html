<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felis Ödül Kategorileri</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0f;
    color: #e8e8f0;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a0a2e 0%, #0d0d1a 50%, #0a1628 100%);
    border-bottom: 1px solid rgba(139, 92, 246, 0.3);
    padding: 3rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at center, rgba(139,92,246,0.08) 0%, transparent 60%);
    pointer-events: none;
  }

  .countdown-bar {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 18px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    padding: 1.2rem 2rem;
    margin-bottom: 1.8rem;
  }

  .countdown-label {
    color: #f87171;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .countdown-units {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .cd-block {
    background: rgba(239,68,68,0.12);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 10px;
    padding: 10px 16px;
    text-align: center;
    min-width: 72px;
  }

  .cd-num {
    font-size: 36px;
    font-weight: 700;
    color: #fca5a5;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .cd-unit {
    font-size: 10px;
    color: rgba(232,232,240,0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .cd-sep {
    font-size: 28px;
    font-weight: 700;
    color: rgba(239,68,68,0.4);
    margin: 0 2px;
    padding-bottom: 16px;
  }

  .countdown-bar.urgent .cd-num { color: #f87171; }
  .countdown-bar.ended .cd-num { color: #6b7280; }

  .header-tag {
    display: inline-block;
    background: rgba(139, 92, 246, 0.15);
    border: 1px solid rgba(139, 92, 246, 0.4);
    color: #a78bfa;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 1.2rem;
  }

  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    background: linear-gradient(135deg, #e8e8f0 0%, #a78bfa 50%, #60a5fa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 0.8rem;
  }

  header p {
    color: rgba(232, 232, 240, 0.55);
    font-size: 1rem;
    max-width: 500px;
    margin: 0 auto;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: #a78bfa;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(232,232,240,0.4);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .search-bar {
    max-width: 600px;
    margin: 2rem auto 0;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(139,92,246,0.25);
    border-radius: 12px;
    padding: 0.75rem 1rem 0.75rem 2.8rem;
    color: #e8e8f0;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus {
    border-color: rgba(139,92,246,0.6);
    background: rgba(255,255,255,0.07);
  }

  .search-bar input::placeholder { color: rgba(232,232,240,0.3); }

  .tag-section {
    max-width: 700px;
    margin: 1.4rem auto 0;
  }

  .tag-section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(232,232,240,0.35);
    text-align: center;
    margin-bottom: 0.6rem;
  }

  .brand-tags-wrap {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .brand-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: rgba(139,92,246,0.1);
    border: 1px solid rgba(139,92,246,0.25);
    color: #c4b5fd;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .brand-tag:hover {
    background: rgba(139,92,246,0.18);
    border-color: rgba(139,92,246,0.4);
  }

  .brand-tag.active {
    background: rgba(139,92,246,0.3);
    border-color: rgba(139,92,246,0.6);
    color: #fff;
  }

  .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .status-tag.active {
    box-shadow: 0 0 0 2px currentColor inset;
  }

  .brand-tag-count {
    font-size: 10px;
    color: rgba(232,232,240,0.4);
    background: rgba(0,0,0,0.25);
    padding: 1px 6px;
    border-radius: 10px;
  }

  .brand-panel {
    background: rgba(139,92,246,0.05);
    border: 1px solid rgba(139,92,246,0.2);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .brand-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .brand-panel-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #c4b5fd;
  }

  .brand-panel-close {
    background: rgba(255,255,255,0.06);
    border: none;
    color: rgba(232,232,240,0.6);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }

  .brand-panel-close:hover {
    background: rgba(255,255,255,0.1);
  }

  .brand-panel-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 14px;
  }

  .brand-panel-row:first-child {
    border-top: none;
  }

  .brand-panel-cat {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(139,92,246,0.12);
    color: #c4b5fd;
    flex-shrink: 0;
  }

  .brand-panel-proj {
    color: rgba(232,232,240,0.85);
  }

  .search-icon {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(232,232,240,0.3);
    font-size: 1rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }

  .section-grid {
    display: grid;
    gap: 1.5rem;
  }

  .section-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .section-card:hover {
    border-color: rgba(255,255,255,0.12);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 1.5rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .section-header:hover {
    background: rgba(255,255,255,0.02);
  }

  .section-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .section-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }

  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #e8e8f0;
    margin-bottom: 2px;
  }

  .section-meta {
    font-size: 13px;
    color: rgba(232,232,240,0.45);
  }

  .section-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .count-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .chevron {
    width: 20px;
    height: 20px;
    color: rgba(232,232,240,0.35);
    transition: transform 0.25s ease, color 0.15s;
    flex-shrink: 0;
  }

  .section-card.open .chevron {
    transform: rotate(180deg);
    color: rgba(232,232,240,0.7);
  }

  .section-body {
    display: none;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .section-card.open .section-body {
    display: block;
  }

  .subsection-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 1.1rem 1.5rem 0.5rem;
    color: rgba(232,232,240,0.4);
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  .subsection-title:first-child {
    border-top: none;
  }

  .category-list {
    padding: 0 1rem 1rem;
  }

  .cat-item {
    display: flex;
    align-items: flex-start;
    gap: 0.9rem;
    padding: 0.75rem 0.5rem;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s;
    position: relative;
  }

  .cat-item:hover {
    background: rgba(255,255,255,0.04);
  }

  .cat-code {
    font-size: 12px;
    font-weight: 700;
    font-family: 'SF Mono', 'Fira Code', monospace;
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
    margin-top: 1px;
    letter-spacing: 0.05em;
  }

  .cat-info { flex: 1; min-width: 0; }

  .cat-name {
    font-size: 1rem;
    font-weight: 500;
    color: #e2e2ee;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .new-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    background: rgba(16,185,129,0.15);
    color: #34d399;
    border: 1px solid rgba(16,185,129,0.25);
  }

  .cat-desc {
    font-size: 0.88rem;
    color: rgba(232,232,240,0.45);
    line-height: 1.55;
    margin-top: 4px;
    display: none;
  }

  .cat-item.expanded .cat-desc {
    display: block;
  }

  .expand-icon {
    font-size: 0.75rem;
    color: rgba(232,232,240,0.25);
    margin-top: 3px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .cat-item.expanded .expand-icon {
    transform: rotate(180deg);
    color: rgba(232,232,240,0.5);
  }

  .our-work-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 0.5rem;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid;
    transition: all 0.15s;
  }

  .work-panel {
    display: none;
    margin-top: 0.5rem;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 0.75rem;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .work-panel.open { display: block; }

  .works-table-wrap {
    margin-top: 0.6rem;
  }

  .works-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid;
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
    background: rgba(255,255,255,0.02);
  }

  .works-table thead th {
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 7px 12px;
    color: rgba(232,232,240,0.5);
    border-bottom: 1px solid;
  }

  .works-table tbody tr {
    transition: background 0.1s;
  }

  .works-table tbody tr:nth-child(odd) {
    background: rgba(255,255,255,0.025);
  }

  .works-table tbody tr:hover {
    background: rgba(255,255,255,0.06);
  }

  .works-table td {
    padding: 8px 12px;
    border-top: 1px solid rgba(255,255,255,0.05);
    color: rgba(232,232,240,0.85);
  }

  .works-table tr:first-child td {
    border-top: none;
  }

  .works-table-num {
    width: 28px;
    color: rgba(232,232,240,0.3);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }

  .works-table-brand {
    width: 32%;
    font-weight: 700;
    padding-left: 12px;
    border-left: 3px solid;
  }

  .works-table-name {
    width: 100%;
    color: rgba(232,232,240,0.85);
  }

  .status-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .works-table-actions {
    white-space: nowrap;
    text-align: right;
  }

  .action-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 5px;
    font-size: 13px;
    opacity: 0.4;
    transition: opacity 0.15s, background 0.15s;
  }

  .action-btn:hover { opacity: 1; background: rgba(255,255,255,0.08); }
  .delete-btn:hover { background: rgba(239,68,68,0.15); }
  .edit-btn:hover { background: rgba(59,130,246,0.15); }

  /* Modal */
  #editModal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }

  .modal-box {
    position: relative;
    background: #181825;
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 16px;
    padding: 1.75rem;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: #e8e8f0;
    margin-bottom: 1.2rem;
  }

  .modal-fields {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-bottom: 1.2rem;
  }

  .modal-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 8px 12px;
    color: #e8e8f0;
    font-size: 14px;
    outline: none;
    width: 100%;
  }

  .modal-input:focus {
    border-color: rgba(139,92,246,0.5);
  }

  .modal-actions {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
  }

  .modal-cancel {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(232,232,240,0.6);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s;
  }

  .modal-cancel:hover { background: rgba(255,255,255,0.1); }

  .modal-save {
    background: rgba(139,92,246,0.25);
    border: 1px solid rgba(139,92,246,0.45);
    color: #c4b5fd;
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s;
  }

  .modal-save:hover { background: rgba(139,92,246,0.35); }

  .work-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.4rem 0;
    font-size: 12px;
    color: rgba(232,232,240,0.55);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .work-item:last-child { border-bottom: none; }

  .work-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .add-work-input {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.6rem;
  }

  .add-work-input input {
    flex: 1;
    min-width: 120px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 5px 10px;
    color: #e8e8f0;
    font-size: 12px;
    outline: none;
  }

  .add-work-input input::placeholder { color: rgba(232,232,240,0.25); }

  .status-select {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 5px 8px;
    color: #e8e8f0;
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }

  .status-select option {
    background: #1a1a24;
    color: #e8e8f0;
  }

  .add-btn {
    background: rgba(139,92,246,0.2);
    border: 1px solid rgba(139,92,246,0.35);
    color: #a78bfa;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .add-btn:hover { background: rgba(139,92,246,0.3); }

  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: rgba(232,232,240,0.3);
    font-size: 0.95rem;
  }

  .hidden { display: none !important; }

  @media (max-width: 600px) {
    header { padding: 2rem 1rem; }
    .container { padding: 2rem 1rem; }
    .stats-bar { gap: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <div id="countdownBar" class="countdown-bar">
    <span class="countdown-label">⏱ Son Başvuru — 23 Eylül 2026</span>
    <div class="countdown-units">
      <div class="cd-block"><div class="cd-num" id="cd-days">--</div><div class="cd-unit">gün</div></div>
      <span class="cd-sep">:</span>
      <div class="cd-block"><div class="cd-num" id="cd-hours">--</div><div class="cd-unit">saat</div></div>
      <span class="cd-sep">:</span>
      <div class="cd-block"><div class="cd-num" id="cd-mins">--</div><div class="cd-unit">dak</div></div>
      <span class="cd-sep">:</span>
      <div class="cd-block"><div class="cd-num" id="cd-secs">--</div><div class="cd-unit">sn</div></div>
    </div>
  </div>
  <div class="header-tag">Felis Ödülleri</div>
  <h1>Kategori Listesi</h1>
  <p>Yarışacağımız kategorileri keşfedin ve işlerinizi ekleyin</p>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num" id="total-sections">—</div><div class="stat-label">Ana Başlık</div></div>
    <div class="stat"><div class="stat-num" id="total-cats">—</div><div class="stat-label">Kategori</div></div>
    <div class="stat"><div class="stat-num" id="total-works">0</div><div class="stat-label">Eklenen İş</div></div>
  </div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Kategori ara... (örn: film, dijital, sosyal medya)">
  </div>
  <div class="tag-section">
    <div class="tag-section-label">Markalar</div>
    <div class="brand-tags-wrap" id="brandTagsWrap"></div>
  </div>
  <div class="tag-section">
    <div class="tag-section-label">Yayın Durumu</div>
    <div class="brand-tags-wrap" id="statusTagsWrap"></div>
  </div>
</header>

<div class="container">
  <div class="brand-panel hidden" id="brandPanel"></div>
  <div class="section-grid" id="sectionGrid"></div>
  <div class="no-results hidden" id="noResults">Arama sonucu bulunamadı.</div>
</div>

<script>
const sections = [
  {
    id: "BE", title: "Brand Experience", subtitle: "Marka Deneyiminde Mükemmellik",

let workData = {};

async function loadWorkData() {
  try {
    const res = await fetch('/api/works');
    if (res.ok) {
      workData = await res.json();
    }
  } catch (e) {
    workData = {};
  }
}

async function saveWork(kategori_kodu, is_adi) {
  try {
    const res = await fetch('/api/works', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kategori_kodu, is_adi })
    });
    const data = await res.json();
    return data.id || null;
  } catch (e) {
    console.error('Save failed', e);
    return null;
  }
}

async function deleteWork(id) {
  try {
    await fetch('/api/works', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
  } catch (e) {
    console.error('Delete failed', e);
  }
}

async function updateWork(id, is_adi) {
  try {
    await fetch('/api/works', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, is_adi })
    });
  } catch (e) {
    console.error('Update failed', e);
  }
}

function countAllCats() {
  return sections.reduce((sum, s) => sum + s.subsections.reduce((ss, sub) => ss + sub.cats.length, 0), 0);
}

function countWorks() {
  return Object.values(workData).reduce((sum, arr) => sum + arr.length, 0);
}

function updateStats() {
  document.getElementById('total-sections').textContent = sections.length;
  document.getElementById('total-cats').textContent = countAllCats();
  document.getElementById('total-works').textContent = countWorks();
}

          const id = typeof entry === 'object' ? entry.id : null;

                  <input type="text" id="winput-proj-${cat.code}" placeholder="Proje adı..." onkeydown="if(event.key==='Enter')document.getElementById('winput-status-${cat.code}').focus()">
                  <select id="winput-status-${cat.code}" class="status-select">
                    <option value="Sunulmadı">Sunulmadı</option>
                    <option value="Müşteri Onayında">Müşteri Onayında</option>

function renderWorkList(card, section) {
  if (!card) {
    card = document.getElementById('sectionGrid').querySelector(`[data-id="${section.id}"]`);
  }
  if (!card) return;
  section.subsections.forEach(sub => {
    sub.cats.forEach(cat => {
      const wlist = card.querySelector(`#wlist-${cat.code}`);
      if (!wlist) return;
      const works = workData[cat.code] || [];
      wlist.innerHTML = works.length === 0 
        ? '<div style="font-size:12px;color:rgba(232,232,240,0.3);padding:4px 0;">Henüz iş eklenmedi.</div>'
        : works.map(w => `<div class="work-item"><span class="work-dot" style="background:${section.color.dot}"></span>${w}</div>`).join('');
    });
  });
}

function toggleWorkPanel(e, code, color, dot) {
  e.stopPropagation();
  const panel = document.getElementById('wp-' + code);
  panel.classList.toggle('open');
}

async function addWork(code) {
  const brandInput = document.getElementById('winput-brand-' + code);
  const projInput = document.getElementById('winput-proj-' + code);
  const statusInput = document.getElementById('winput-status-' + code);
  const brand = brandInput.value.trim();
  const proj = projInput.value.trim();
  const status = statusInput.value;
  if (!brand || !proj) return;
  const val = `${brand} — ${proj} — ${status}`;
  if (!workData[code]) workData[code] = [];
  const id = await saveWork(code, val);
  workData[code].push({ id, val });
  brandInput.value = '';
  projInput.value = '';
  statusInput.value = 'Sunulmadı';

  const lastSearch = document.getElementById('searchInput').value;
  if (lastSearch) {
    search(lastSearch);
  } else {
    render(null);
  }
  const catItem = document.getElementById('sectionGrid').querySelector(`[data-code="${code}"]`);
  if (catItem) {
    const panel = document.getElementById('wp-' + code);
    if (panel) panel.classList.add('open');
    catItem.classList.add('expanded');
    const parentCard = catItem.closest('.section-card');
    if (parentCard) parentCard.classList.add('open');
    catItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  updateStats();
  renderBrandTags();
  renderStatusTags();
}

const STATUS_LIST = ['Sunulmadı', 'Müşteri Onayında', 'Prodüksiyon Aşamasında', 'Yayınlandı'];
const STATUS_COLORS = {
  'Sunulmadı': { bg: 'rgba(156,163,175,0.15)', text: '#9ca3af', border: 'rgba(156,163,175,0.3)' },
  'Müşteri Onayında': { bg: 'rgba(251,191,36,0.15)', text: '#fbbf24', border: 'rgba(251,191,36,0.3)' },
  'Prodüksiyon Aşamasında': { bg: 'rgba(59,130,246,0.15)', text: '#60a5fa', border: 'rgba(59,130,246,0.3)' },
  'Yayınlandı': { bg: 'rgba(16,185,129,0.15)', text: '#34d399', border: 'rgba(16,185,129,0.3)' },
};

function parseWork(w) {
  const parts = w.split(' — ');
  let brand = '', proj = w, status = 'Sunulmadı';
  if (parts.length >= 3) {
    brand = parts[0].trim();
    status = parts[parts.length - 1].trim();
    proj = parts.slice(1, parts.length - 1).join(' — ').trim();
    if (!STATUS_LIST.includes(status)) {
      // last part isn't actually a status (older data), treat as part of project name
      proj = parts.slice(1).join(' — ').trim();
      status = 'Sunulmadı';
    }
  } else if (parts.length === 2) {
    brand = parts[0].trim();
    proj = parts[1].trim();
    status = 'Sunulmadı';
  }
  return { brand, proj, status };
}

function getBrandMap() {
  const brandMap = {};
  for (const code in workData) {
    const cat = findCatByCode(code);
    if (!cat) continue;
    (workData[code] || []).forEach(entry => {
      const w = typeof entry === 'object' ? entry.val : entry;
      const { brand, proj, status } = parseWork(w);
      if (!brand) return;
      if (!brandMap[brand]) brandMap[brand] = [];
      brandMap[brand].push({ code, catName: cat.name, proj, status });
    });
  }
  return brandMap;
}

function getStatusMap() {
  const statusMap = {};
  STATUS_LIST.forEach(s => statusMap[s] = []);
  for (const code in workData) {
    const cat = findCatByCode(code);
    if (!cat) continue;
    (workData[code] || []).forEach(entry => {
      const w = typeof entry === 'object' ? entry.val : entry;
      const { brand, proj, status } = parseWork(w);
      if (!brand) return;
      if (!statusMap[status]) statusMap[status] = [];
      statusMap[status].push({ code, catName: cat.name, brand, proj });
    });
  }
  return statusMap;
}

function findCatByCode(code) {
  for (const section of sections) {
    for (const sub of section.subsections) {
      const cat = sub.cats.find(c => c.code === code);
      if (cat) return cat;
    }
  }
  return null;
}

function renderBrandTags() {
  const wrap = document.getElementById('brandTagsWrap');
  const brandMap = getBrandMap();
  const brands = Object.keys(brandMap).sort();
  if (brands.length === 0) {
    wrap.innerHTML = '<span style="font-size:12px;color:rgba(232,232,240,0.25);">Henüz iş eklenmedi.</span>';
    return;
  }
  wrap.innerHTML = brands.map(b => `
    <span class="brand-tag" data-brand="${b}" onclick="showBrandPanel('${b.replace(/'/g, "\\'")}')">
      ${b} <span class="brand-tag-count">${brandMap[b].length}</span>
    </span>
  `).join('');
}

function renderStatusTags() {
  const wrap = document.getElementById('statusTagsWrap');
  const statusMap = getStatusMap();
  const totalWorks = Object.values(statusMap).reduce((s, arr) => s + arr.length, 0);
  if (totalWorks === 0) {
    wrap.innerHTML = '<span style="font-size:12px;color:rgba(232,232,240,0.25);">Henüz iş eklenmedi.</span>';
    return;
  }
  wrap.innerHTML = STATUS_LIST.map(s => {
    const sc = STATUS_COLORS[s];
    const count = (statusMap[s] || []).length;
    return `
    <span class="status-tag" data-status="${s}" style="background:${sc.bg};color:${sc.text};border:1px solid ${sc.border}" onclick="showStatusPanel('${s}')">
      ${s} <span class="brand-tag-count">${count}</span>
    </span>`;
  }).join('');
}

function showStatusPanel(status) {
  const statusMap = getStatusMap();
  const items = statusMap[status] || [];
  const sc = STATUS_COLORS[status];
  const panel = document.getElementById('brandPanel');
  panel.classList.remove('hidden');
  panel.innerHTML = `
    <div class="brand-panel-header">
      <div class="brand-panel-title" style="color:${sc.text}">${status} — ${items.length} iş</div>
      <button class="brand-panel-close" onclick="closeBrandPanel()">✕</button>
    </div>
    ${items.map(it => `
      <div class="brand-panel-row">
        <span class="brand-panel-cat">${it.code}</span>
        <span style="font-weight:700;color:rgba(232,232,240,0.9);">${it.brand}</span>
        <span class="brand-panel-proj">${it.proj}</span>
        <span style="color:rgba(232,232,240,0.45);font-size:12px;margin-left:auto;">${it.catName}</span>
      </div>
    `).join('')}
  `;
  document.querySelectorAll('.status-tag').forEach(t => {
    t.classList.toggle('active', t.dataset.status === status);
  });
  document.querySelectorAll('.brand-tag').forEach(t => t.classList.remove('active'));

  const codes = new Set(items.map(it => it.code));
  const filtered = [];
  sections.forEach(section => {
    const filteredSubs = section.subsections.map(sub => {
      const filteredCats = sub.cats.filter(cat => codes.has(cat.code));
      return filteredCats.length > 0 ? { ...sub, cats: filteredCats } : null;
    }).filter(Boolean);
    if (filteredSubs.length > 0) filtered.push({ ...section, subsections: filteredSubs });
  });
  document.getElementById('searchInput').value = '';
  render(filtered);
  document.querySelectorAll('.section-card').forEach(c => c.classList.add('open'));
  document.querySelectorAll('.cat-item').forEach(c => c.classList.add('expanded'));

  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showBrandPanel(brand) {
  const brandMap = getBrandMap();
  const items = brandMap[brand] || [];
  const panel = document.getElementById('brandPanel');
  panel.classList.remove('hidden');
  panel.innerHTML = `
    <div class="brand-panel-header">
      <div class="brand-panel-title">${brand} — ${items.length} iş</div>
      <button class="brand-panel-close" onclick="closeBrandPanel()">✕</button>

      return `

        <span class="brand-panel-proj">${it.proj}</span>
        <span class="status-badge" style="background:${sc.bg};color:${sc.text};border:1px solid ${sc.border}">${it.status}</span>
        <span style="color:rgba(232,232,240,0.45);font-size:12px;margin-left:auto;">${it.catName}</span>
      </div>
    `;
    }).join('')}
  `;
  document.querySelectorAll('.brand-tag').forEach(t => {
    t.classList.toggle('active', t.dataset.brand === brand);
  });
  document.querySelectorAll('.status-tag').forEach(t => t.classList.remove('active'));

  const codes = new Set(items.map(it => it.code));
  const filtered = [];
  sections.forEach(section => {
    const filteredSubs = section.subsections.map(sub => {
      const filteredCats = sub.cats.filter(cat => codes.has(cat.code));
      return filteredCats.length > 0 ? { ...sub, cats: filteredCats } : null;
    }).filter(Boolean);
    if (filteredSubs.length > 0) filtered.push({ ...section, subsections: filteredSubs });

  document.getElementById('searchInput').value = '';
  render(filtered);
  document.querySelectorAll('.section-card').forEach(c => c.classList.add('open'));

async function removeWork(e, id, code) {
  e.stopPropagation();
  if (!confirm('Bu işi silmek istediğinden emin misin?')) return;
  workData[code] = (workData[code] || []).filter(entry => {
    const entryId = typeof entry === 'object' ? entry.id : null;
    return entryId !== id;
  });
  await deleteWork(id);
  render(null);
  renderBrandTags();
  renderStatusTags();
  updateStats();
}

function editWork(e, id, code, currentVal) {
  e.stopPropagation();
  const { brand, proj, status } = parseWork(currentVal);

  // Mevcut modal varsa kaldır
  const existing = document.getElementById('editModal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'editModal';
  modal.innerHTML = `
    <div class="modal-overlay" onclick="closeEditModal()"></div>
    <div class="modal-box">
      <div class="modal-title">İşi Düzenle</div>
      <div class="modal-fields">
        <input class="modal-input" id="edit-brand" value="${brand}" placeholder="Marka...">
        <input class="modal-input" id="edit-proj" value="${proj}" placeholder="Proje adı...">
        <select class="status-select" id="edit-status">
          ${STATUS_LIST.map(s => `<option value="${s}" ${s === status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeEditModal()">İptal</button>
        <button class="modal-save" onclick="saveEditWork(${id}, '${code}')">Kaydet</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveEditWork(id, code) {
  const brand = document.getElementById('edit-brand').value.trim();
  const proj = document.getElementById('edit-proj').value.trim();
  const status = document.getElementById('edit-status').value;
  if (!brand || !proj) return;
  const newVal = `${brand} — ${proj} — ${status}`;

  const entry = (workData[code] || []).find(e => (typeof e === 'object' ? e.id : null) === id);
  if (entry) entry.val = newVal;

  await updateWork(id, newVal);
  closeEditModal();
  render(null);
  renderBrandTags();
  renderStatusTags();
}

function closeEditModal() {
  const modal = document.getElementById('editModal');
  if (modal) modal.remove();
}

function closeBrandPanel() {
  document.getElementById('brandPanel').classList.add('hidden');
  document.querySelectorAll('.brand-tag').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.status-tag').forEach(t => t.classList.remove('active'));
  render(null);
}

function search(q) {
  if (!q) { render(null); return; }
  q = q.toLowerCase();
  const result = [];
  sections.forEach(section => {
    const matchSec = section.title.toLowerCase().includes(q) || section.subtitle.toLowerCase().includes(q);
    const filteredSubs = section.subsections.map(sub => {
      const matchSub = sub.title && sub.title.toLowerCase().includes(q);
      const filteredCats = sub.cats.filter(cat => 
        cat.code.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q) || (cat.desc && cat.desc.toLowerCase().includes(q)) || matchSub || matchSec
      );
      return filteredCats.length > 0 ? { ...sub, cats: filteredCats } : null;
    }).filter(Boolean);
    if (filteredSubs.length > 0) result.push({ ...section, subsections: filteredSubs });
  });
  render(result);
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => search(e.target.value), 200);
});

(async function init() {
  await loadWorkData();
  render(null);
  updateStats();
  renderBrandTags();
  renderStatusTags();
})();

(function() {
  const deadline = new Date('2026-09-23T23:59:59');
  function tick() {
    const now = new Date();
    const diff = deadline - now;
    const bar = document.getElementById('countdownBar');
    if (diff <= 0) {
      document.getElementById('cd-days').textContent = '00';
      document.getElementById('cd-hours').textContent = '00';
      document.getElementById('cd-mins').textContent = '00';
      document.getElementById('cd-secs').textContent = '00';
      bar.classList.add('ended');
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent = String(d).padStart(2,'0');
    document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
    if (d < 7) bar.classList.add('urgent');
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
